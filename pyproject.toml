[project]
name = "windows-gui-agent-runtime"
version = "0.1.0"
description = "Experimental, gate-controlled GUI agent runtime baseline"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "Wenqing Ji"}]
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.8,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "modules*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
